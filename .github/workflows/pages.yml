name: Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - docs/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    name: Deploy Kryon Labs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kryonlabs/kryon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: kryonlabs/kryon

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install private display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb

      # make site produces the committed Canvas/Wasm assets reviewed locally.
      # Publish those exact files after testing them; source compilation stays
      # in CI and does not change the approved website during deployment.
      - name: Check static site assets
        run: |
          test -f docs/site/index.html
          test -f docs/site/demo.html
          test -f docs/site/assets/widgets.html
          test -f docs/site/assets/preview.html
          test -f docs/site/assets/playground-runtime.js
          test -f docs/site/assets/playground-runtime.wasm
          test -f docs/site/demo.js
          test -f docs/site/demo.css
          test -f docs/site/demo-worker.js
          test -f docs/site/demo-theme.js
          test -f docs/site/current.css
          test -f docs/site/favicon.svg
          test -f docs/site/favicon-32.png
          test -f docs/site/og.png
          test -f docs/site/assets/brand/mark.svg
          test -f docs/site/widgets.html
          test -f docs/site/assets/widget-gallery.html
          test -f docs/site/assets/catalog-image.png
          test -f docs/site/gallery-data.js
          test -f docs/site/live-editor.js
          test -f docs/site/gallery-sources/kryon/0.zi

      - name: Test the compiled widget gallery
        env:
          CHROMIUM: google-chrome
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS YUE_DESKTOP_RECOVERY=0 node tests/gallery_browser.mjs

      - name: Test live preview and rendered themes
        env:
          CHROMIUM: google-chrome
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY node tests/demo_browser.mjs

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy kryonlabs/kryon/docs/site --project-name=kryon --branch=master
