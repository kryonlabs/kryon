[package]
name = "{{name}}"
entry = "src/app.tsx"
module_roots = ["src"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "4ae21503f282f77c4c83df81fcea70bbbb5392aa"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "f4bda4733366bea32e64fa632906410242230122"

[install]
bin = "{{name}}"

# A terminal program first; `kryon run desktop` opens the same interface in
# a window.
[tool.kryon]
default_profile = "tui"
entry = "src/app.tsx"

[tool.kryon.profiles.tui]
backend = "terminal"

[tool.kryon.profiles.desktop]
backend = "desktop"

# Downloadable app, rendered by the shared Zx player.
[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"
