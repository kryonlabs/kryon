[package]
name = "box"
entry = "box.zi"
module_roots = ["."]
tool = "kryon"


[toolchain]
git = "https://github.com/ziranlang/ziran.git"
# Ziran v0.6.0
ref = "d17c7aa1e093066ef03f307a45f6966dd9b29d4b"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.portable_web]
backend = "canvas"
codegen = "zx"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[dependencies.plot]
git = "https://github.com/kryonlabs/plot.git"
ref = "master"

[dependencies.data_views]
git = "https://github.com/kryonlabs/data-views.git"
ref = "master"
