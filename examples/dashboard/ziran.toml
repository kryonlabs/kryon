[package]
name = "dashboard"
entry = "src/app.tsx"
module_roots = ["src", "previews"]
links = ["X11", "cairo"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "fac8a39688135feb38671553fb288887170575ab"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "2f9b5db29bcfe10a0bb124ac7d1f6d316a16f148"

[dependencies.css]
git = "https://git.waozi.xyz/kryonlabs/css.git"
ref = "d55590a6cd97fc22096227d619e13f656f12c5b3"

[tool.kryon]
default_profile = "desktop"
entry = "src/app.tsx"

[tool.kryon.profiles.desktop]
backend = "desktop"
host = "src/desktop_host.zi"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.web]
backend = "canvas"
