[package]
name = "{{name}}"
entry = "src/app.zi"
module_roots = ["src"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "4413456221aa5a9bc00a368762e9e50aaf6e7b6b"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "ddb7c1940b662abebb55d6b70177f550e94971c3"

# Look presets (classic, lightfield, material), pinned with the same Kryon.
[dependencies.css]
git = "https://git.waozi.xyz/kryonlabs/css.git"
ref = "2be03f3826bd31fcde3ace00bc1234bdbd34b5c4"

[install]
bin = "{{name}}"

# `kryon run` opens the default profile; `kryon run web` picks another.
# The tui template is the starting point for terminal programs.
[tool.kryon]
default_profile = "desktop"
entry = "src/app.zi"

[tool.kryon.profiles.desktop]
backend = "desktop"

# Downloadable app, rendered by the shared Zx player.
[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.web]
backend = "canvas"

# `kryon run shot --png shot.png --width 390 --height 844 --theme dark`
# draws the app offscreen, at any size, without a display.
[tool.kryon.profiles.shot]
backend = "pixmap"

# Android package: `kryon build --profile android` generates the droid/
# project on the first build and assembles a debug APK. The application id
# is required; min_sdk and abis are optional.
# [tool.kryon.profiles.android]
# backend = "android"
#
# [tool.kryon.android]
# frame_mode = "events"
# package = "com.example.{{name}}"

[tool.kryon.install]
profile = "desktop"
name = "{{name}}"
comment = "A Kryon application"
categories = "Utility;"
