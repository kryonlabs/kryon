[package]
name = "{{name}}"
entry = "src/app.zi"
module_roots = ["src"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[install]
bin = "{{name}}"

# `kryon run` opens the default profile; `kryon run tui` picks another.
[tool.kryon]
default_profile = "desktop"
entry = "src/app.zi"

[tool.kryon.profiles.desktop]
backend = "desktop"

# Downloadable app, rendered by the shared Zib player.
[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zib"

[tool.kryon.profiles.tui]
backend = "terminal"

[tool.kryon.profiles.web]
backend = "canvas"

# `kryon run shot > screen.ppm` renders one frame without a display.
[tool.kryon.profiles.shot]
backend = "pixmap"

# Android package: `kryon build --profile android` generates the droid/
# project on the first build and assembles a debug APK. The application id
# is required; min_sdk and abis are optional.
# [tool.kryon.profiles.android]
# backend = "android"
#
# [tool.kryon.android]
# package = "com.example.{{name}}"

[tool.kryon.install]
profile = "desktop"
name = "{{name}}"
comment = "A Kryon application"
categories = "Utility;"
