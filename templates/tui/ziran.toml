[package]
name = "{{name}}"
entry = "src/app.tsx"
module_roots = ["src"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "dc3ecf0aabd1630881c13783a660ca8b298eff88"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "39f7540d193ccaa2096e1115df608da8116b32b7"

[install]
bin = "{{name}}"

# A terminal program first; `kryon run desktop` opens the same interface in
# a window.
[tool.kryon]
default_profile = "tui"
entry = "src/app.tsx"

[tool.kryon.profiles.tui]
backend = "terminal"

[tool.kryon.profiles.desktop]
backend = "desktop"

# Downloadable app, rendered by the shared Zx player.
[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"
