[package]
name = "{{name}}"
entry = "src/app.tsx"
module_roots = ["src"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "84c42c76a63b022fa9355148c4213d9032b7eeff"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "628b8846cb6e9fbbb99d08a72f421ca880b75f2d"

# Look presets (classic, lightfield, material), pinned with the same Kryon.
[dependencies.css]
git = "https://git.waozi.xyz/kryonlabs/css.git"
ref = "5d62effb43736195e2787a2fea9958e1201140f6"

[install]
bin = "{{name}}"

# `kryon run` opens the default profile; `kryon run web` picks another.
# The tui template is the starting point for terminal programs.
[tool.kryon]
default_profile = "desktop"
entry = "src/app.tsx"

[tool.kryon.profiles.desktop]
backend = "desktop"

# Downloadable app, rendered by the shared Zx player.
[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.install]
profile = "desktop"
name = "{{name}}"
comment = "A Kryon application"
categories = "Utility;"
