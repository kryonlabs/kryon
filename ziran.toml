[tool]
project = "build/bin/kryon"

# Project templates: `kryon new hello` (or `ziran new hello --template
# kryonlabs/kryon`) starts from the first; `kryon new hello --template tui`
# from another.
[templates]
app = "templates/app"
tui = "templates/tui"
pages = "templates/pages"
web = "templates/web"

# Settings an application gives the kryon tool under [tool.kryon].
[options]
default_profile = "string"
entry = "string"

[options.profiles."*"]
backend = "string!"
codegen = "string=c99"
host = "string"
library = "string"
static_archive = "string"
native_artifacts = "string"
native_platform = "string"
assets = "string"
platform = "string"
preload = "string"

# Android profile settings: the application id of the generated droid
# project, the minimum system version, the built ABIs, and the activity
# class name inside the package.
[options.android]
package = "string"
min_sdk = "string=21"
abis = "string=arm64-v8a"
activity = "string=MainActivity"
bundled_fonts = "bool=false"
frame_mode = "string=adaptive"

# Used by `ziran install` to build one profile and add it to the desktop.
[options.install]
profile = "string"
name = "string"
comment = "string"
icon = "string"
icon_name = "string"
categories = "string"
working_directory = "string"
autostart = "bool=false"
autostart_env = "string"

# Native platform/ABI is selected by pkg artifact --platform, not codegen.
[options.renderer]
android_ndk = "string"
android_api = "string=21"

[artifacts.renderer-desktop]
inputs = ["cmake/desktop-codecs/CMakeLists.txt", "mk/codecs.mk", "scripts/build_avif.py", "scripts/codec_configure.py", "cmake/WebP.cmake", "cmake/webp/CMakeLists.txt", "cmake/AVIF.cmake", "cmake/ImagePackages.cmake", "cmake/avif/CMakeLists.txt", "src/project/cli_linux.zi", "src/project/options.zi", "scripts/renderer_artifact.py", "assets/fonts/LiberationSans-Regular.ttf", "assets/fonts/LICENSE-Liberation"]
outputs = ["lib/libkryonwebp.a", "lib/libavif.a", "lib/libopus.a", "lib/libkryonavif.so", "resources/LICENSE-libwebp", "resources/PATENTS-libwebp", "resources/LICENSE-opus", "resources/LICENSE-libavif", "resources/LICENSE-dav1d", "resources/kryon-font.ttf", "resources/LICENSE-Liberation", "renderer.json"]

# AVIF compression: the same profile plus libaom. The default artifact decodes
# with dav1d only; select this one from the apps that import AVIF encoding.
[artifacts.renderer-desktop-encode]
inputs = ["cmake/desktop-codecs/CMakeLists.txt", "mk/codecs.mk", "scripts/build_avif.py", "scripts/codec_configure.py", "cmake/WebP.cmake", "cmake/webp/CMakeLists.txt", "cmake/AVIF.cmake", "cmake/ImagePackages.cmake", "cmake/avif/CMakeLists.txt", "src/project/cli_linux.zi", "src/project/options.zi", "scripts/renderer_artifact.py", "assets/fonts/LiberationSans-Regular.ttf", "assets/fonts/LICENSE-Liberation"]
outputs = ["lib/libkryonwebp.a", "lib/libavif.a", "lib/libaom.a", "lib/libopus.a", "lib/libkryonavif.so", "resources/LICENSE-libwebp", "resources/PATENTS-libwebp", "resources/LICENSE-opus", "resources/LICENSE-libavif", "resources/LICENSE-libaom", "resources/PATENTS-libaom", "resources/LICENSE-dav1d", "resources/kryon-font.ttf", "resources/LICENSE-Liberation", "renderer.json"]

[artifacts.renderer-web]
inputs = ["src/project/cli_linux.zi", "src/project/options.zi", "scripts/renderer_artifact.py", "assets/fonts/LiberationSans-Regular.ttf", "assets/fonts/LICENSE-Liberation"]
outputs = ["web/ziran_web.js", "resources/kryon-font.ttf", "resources/LICENSE-Liberation", "renderer.json"]

[dependencies.sdl3]
git = "https://github.com/libsdl-org/SDL.git"
ref = "829a65d769d935c4852f8159e964312c0957260a"
source = true

# Optional SDL3 GPU renderer support; no change to existing renderer defaults.
[artifacts.native-sdl3]
inputs = ["src/project/cli_linux.zi", "src/project/options.zi", "scripts/renderer_artifact.py", "scripts/build-sdl3.sh"]
outputs = ["lib/libSDL3.a", "lib/pkgconfig/sdl3.pc", "link.txt", "resources/LICENSE-SDL3", "resources/SDL_build_config.h", "resources/SDL3-headers.tar", "include/SDL3/SDL.h", "include/SDL3/SDL_render.h", "include/SDL3/SDL_gpu.h", "include/SDL3/SDL_version.h"]

[dependencies.libavif]
git = "https://github.com/AOMediaCodec/libavif.git"
ref = "1aadfad932c98c069a1204261b1856f81f3bc199"
source = true

[dependencies.libaom]
git = "https://aomedia.googlesource.com/aom"
ref = "b141d9c45db236335351c8a4b2a14b3ade27c937"
source = true

[dependencies.image_codec]
git = "https://git.waozi.xyz/ziranlang/image-codec.git"
ref = "3017f0d1cc56975aa29c600a1f55a62e1193cf7b"

[dependencies.avif]
git = "https://git.waozi.xyz/ziranlang/avif.git"
ref = "6ff696d436b6b4f142eb1e3ecf210de7adfa048f"

[dependencies.webp]
git = "https://git.waozi.xyz/ziranlang/webp.git"
ref = "4b9a61d32460d481624fe0f83996a7de50327dfe"

[dependencies.audio]
git = "https://git.waozi.xyz/ziranlang/audio.git"
ref = "b5c6b56b71172c4361ae01e3afdd2118bdac0975"

# MinGW import libraries; runtime.tar holds the matching DLLs and licenses.
[artifacts.renderer-desktop-windows]
inputs = ["src/project/cli_linux.zi", "scripts/renderer_artifact.py", "scripts/windows_desktop.py", "scripts/windows-desktop-packages.json", "assets/fonts/LiberationSans-Regular.ttf", "assets/fonts/LICENSE-Liberation"]
outputs = ["lib/libSDL2.dll.a", "lib/libcairo.dll.a", "lib/libpangocairo-1.0.dll.a", "lib/libpango-1.0.dll.a", "lib/libfontconfig.dll.a", "lib/libfreetype.dll.a", "lib/libgobject-2.0.dll.a", "lib/libglib-2.0.dll.a", "lib/libgdk_pixbuf-2.0.dll.a", "lib/libopus.dll.a", "runtime.tar", "resources/kryon-font.ttf", "resources/LICENSE-Liberation", "renderer.json"]
