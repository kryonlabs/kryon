[tool]
project = "build/bin/kryon"

# Project templates: `kryon new hello` (or `ziran new hello --template
# kryonlabs/kryon`) starts from the first; `kryon new hello --template tui`
# from another.
[templates]
app = "templates/app"
tui = "templates/tui"
pages = "templates/pages"
web = "templates/web"

# Settings an application gives the kryon tool under [tool.kryon].
[options]
default_profile = "string"
entry = "string"

[options.profiles."*"]
backend = "string!"
codegen = "string=c99"
host = "string"
library = "string"
static_archive = "string"
native_artifacts = "string"
native_platform = "string"
assets = "string"
platform = "string"
preload = "string"

# Android profile settings: the application id of the generated droid
# project, the minimum system version, the built ABIs, and the activity
# class name inside the package.
[options.android]
package = "string"
min_sdk = "string=21"
abis = "string=arm64-v8a"
activity = "string=MainActivity"

# Used by `ziran install` to build one profile and add it to the desktop.
[options.install]
profile = "string"
name = "string"
comment = "string"
icon = "string"
icon_name = "string"
categories = "string"
working_directory = "string"
autostart = "bool=false"
autostart_env = "string"

# Native platform/ABI is selected by pkg artifact --platform, not codegen.
[options.renderer]
android_ndk = "string"
android_api = "string=21"

[artifacts.renderer-raylib]
inputs = ["src/project/cli_linux.zi", "src/project/options.zi", "scripts/renderer_artifact.py", "Makefile", "mk/renderer-artifact.mk", "mk/raylib-library.mk", "cmake/renderer-artifact/CMakeLists.txt", "cmake/KryonAndroid.cmake", "cmake/ImagePackages.cmake", "cmake/WebP.cmake", "cmake/webp/CMakeLists.txt", "cmake/AVIF.cmake", "cmake/avif/CMakeLists.txt", "assets/fonts/LiberationSans-Regular.ttf", "assets/fonts/LICENSE-Liberation"]
outputs = ["lib/libraylib.a", "lib/libkryonwebp.a", "lib/libavif.a", "lib/libaom.a", "lib/libopus.a", "resources/LICENSE-opus", "resources/LICENSE-libavif", "resources/LICENSE-libaom", "resources/PATENTS-libaom", "resources/LICENSE-dav1d", "include/raylib.h", "include/rlgl.h", "include/raymath.h", "include/rcamera.h", "resources/LICENSE-raylib", "resources/LICENSE-libwebp", "resources/PATENTS-libwebp", "resources/kryon-font.ttf", "resources/LICENSE-Liberation", "renderer.json"]

[artifacts.renderer-desktop]
inputs = ["cmake/AVIF.cmake", "cmake/ImagePackages.cmake", "cmake/avif/CMakeLists.txt","src/project/cli_linux.zi", "src/project/options.zi", "scripts/renderer_artifact.py", "Makefile", "assets/fonts/LiberationSans-Regular.ttf", "assets/fonts/LICENSE-Liberation"]
outputs = ["lib/libkryonavif.so", "resources/LICENSE-libavif", "resources/LICENSE-libaom", "resources/PATENTS-libaom", "resources/LICENSE-dav1d", "resources/kryon-font.ttf", "resources/LICENSE-Liberation", "renderer.json"]

[artifacts.renderer-web]
inputs = ["src/project/cli_linux.zi", "src/project/options.zi", "scripts/renderer_artifact.py", "Makefile", "assets/fonts/LiberationSans-Regular.ttf", "assets/fonts/LICENSE-Liberation"]
outputs = ["web/ziran_web.js", "resources/kryon-font.ttf", "resources/LICENSE-Liberation", "renderer.json"]

