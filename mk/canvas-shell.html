<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kryon Ziran</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #f8fafc; overscroll-behavior: none; }
    #canvas-frame { width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #kryon-ime { position: fixed; left: 0; top: 0; width: 1px; height: 1px; border: 0; padding: 0; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <input id="kryon-ime" type="text" tabindex="-1" aria-hidden="true" autocomplete="off" autocapitalize="off" spellcheck="false">
  <div id="canvas-frame"><canvas id="canvas" tabindex="0"></canvas></div>
  <pre id="result">pending</pre>
  <script>
    var Module = {
      onExit: function(code) {
        document.getElementById("result").textContent = code === 0 ? "PASS" : "FAIL " + code;
      },
      onAbort: function(reason) {
        document.getElementById("result").textContent = "ABORT " + reason;
      }
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
