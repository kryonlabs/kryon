Semantic = "src/ui/semantic.zi"
geometry = "src/ui/geometry.zi"
drawing_props = "src/ui/drawing_props.zi"
Window = "src/ui/window.zi"
Media = "src/ui/media.zi"
Video = "src/ui/video.zi"
VideoLinux = "src/backend/video_linux.zi"
Clock = "src/ui/clock.zi"
ClockLinux = "src/backend/clock_linux.zi"
Service = "src/ui/service.zi"
ServiceLinux = "src/backend/service_linux.zi"
