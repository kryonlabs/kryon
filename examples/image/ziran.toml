[package]
name = "image"
entry = "image.tsx"
module_roots = ["."]
tool = "kryon"


[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "dc3ecf0aabd1630881c13783a660ca8b298eff88"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"
assets = "assets"

[tool.kryon.profiles.portable_web]
backend = "canvas"
codegen = "zx"
assets = "assets"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "master"

[dependencies.plot]
git = "https://git.waozi.xyz/kryonlabs/plot.git"
ref = "master"

[dependencies.data_views]
git = "https://git.waozi.xyz/kryonlabs/data-views.git"
ref = "master"
