plugins {
    id 'com.android.application'
}

// kryon build --profile android passes the checkouts through the environment;
// a plain gradle invocation can pass the same values as properties.
def envOrProp = { String envName, String propName ->
    System.getenv(envName) ?: project.findProperty(propName)
}
def kryonDir = envOrProp('KRYON_DIR', 'kryon.dir')
def ziranDir = envOrProp('ZIRAN_DIR', 'ziran.dir')
def raylibDir = envOrProp('RAYLIB_DIR', 'raylib.dir')
if (kryonDir == null || ziranDir == null || raylibDir == null) {
    throw new GradleException(
        'Pass -Pkryon.dir=... -Pziran.dir=... -Praylib.dir=... ' +
        'or build through kryon build --profile android')
}
def androidAbis = (project.findProperty('app.abis') ?:
    System.getenv('KRYON_ANDROID_ABIS') ?: 'arm64-v8a').split(',').toList()
def appCodegen = envOrProp('KRYON_PROJECT_CODEGEN', 'app.codegen') ?: 'c99'
// One app, three editions: -Papp.edition=direct (the default), fdroid or
// gplay. The Google Play edition adds Play Billing (kryon/play_billing) and
// needs Android 6 and AndroidX (-Pandroid.useAndroidX=true); the others carry
// no Google libraries. Native code sees GOOGLE_PLAY or FDROID.
def appEdition = (project.findProperty('app.edition') ?:
    (project.findProperty('app.googlePlay') == 'true' ? 'gplay' : 'direct')).toString()
if (!(appEdition in ['direct', 'fdroid', 'gplay'])) {
    throw new GradleException('app.edition must be direct, fdroid or gplay')
}
def googlePlay = appEdition == 'gplay'
def requestedMinSdk = Integer.parseInt((project.findProperty('app.minSdk') ?: '21').toString())

android {
    namespace '__PACKAGE__'
    compileSdk 36
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId '__PACKAGE__'
        minSdk googlePlay ? Math.max(requestedMinSdk, 23) : requestedMinSdk
        targetSdk 36
        versionCode 1
        versionName '0.1.0'
        manifestPlaceholders = [zxPlayer: (appCodegen == 'zx').toString(),
            nativeLaunchMode: appCodegen == 'zx' ? 'singleTask' : 'standard']
        ndk {
            abiFilters += androidAbis
        }
        externalNativeBuild {
            cmake {
                arguments '-DKRYON_DIR=' + kryonDir,
                    '-DZIRAN_DIR=' + ziranDir,
                    '-DRAYLIB_DIR=' + raylibDir,
                    '-DAPP_CODEGEN=' + appCodegen,
                    '-DAPP_EDITION=' + appEdition
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    if (appCodegen == 'zx') {
        sourceSets.main.assets.srcDir "${rootProject.projectDir}/../build/android/zx-assets"
        sourceSets.debug.manifest.srcFile 'src/zx/AndroidManifest.xml'
        sourceSets.release.manifest.srcFile 'src/zx/AndroidManifest.xml'
    }

    if (googlePlay) {
        sourceSets.main.java.srcDir 'src/gplay/java'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    if (googlePlay) {
        implementation 'com.android.billingclient:billing:9.1.0'
    }
}
