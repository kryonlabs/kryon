[package]
name = "kryon"
module_roots = ["src/ui", "src/backend"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[dependencies.raylib]
git = "https://github.com/raysan5/raylib.git"
ref = "fafa2cea97d0cb379d832086ba45a989fa6f9c8e"
source = true

[exports]
Frame = "src/ui/tree_draw.zi"
frame_input = "src/ui/frame_input.zi"
frame_capture = "src/ui/frame_capture.zi"
Desktop = "src/backend/Desktop/module.zi"
Libdraw = "src/backend/Libdraw/module.zi"
Cairo = "src/backend/cairo_raster.zi"
Dom = "src/backend/dom_host.zi"
Canvas = "src/backend/Canvas/module.zi"
Raylib = "src/backend/raylib_runtime.zi"
raylib_runtime = "src/backend/raylib_runtime.zi"
AndroidSurface = "src/backend/android_surface.zi"
android_jni = "src/backend/android_jni.zi"
AndroidJni = "src/backend/android_jni.zi"
android_device = "src/backend/android_device.zi"
AndroidDevice = "src/backend/android_device.zi"
android_run = "src/backend/android_run.zi"
android_touch = "src/backend/android_touch.zi"
bundle_player = "src/backend/bundle_player.zi"
# Headless frames: paints into a pixel buffer on every target.
pixmap = "src/backend/pixmap.zi"
pixmap_frame = "src/backend/pixmap_frame.zi"
pixmap_sdl = "src/backend/pixmap_sdl.zi"
pixmap_cell_text = "src/backend/pixmap_cell_text.zi"
EventWakeSDL = "src/backend/event_wake_sdl.zi"
Theme = "src/ui/theme.zi"
ScrollDevice = "src/ui/scroll_device.zi"
Kryon = "src/ui/Kryon/module.zi"
Widgets = "src/ui/Widgets/module.zi"
Page = "src/ui/page.zi"
Semantic = "src/ui/semantic.zi"
geometry = "src/ui/geometry.zi"
drawing_props = "src/ui/drawing_props.zi"
Window = "src/ui/window.zi"
Media = "src/ui/media.zi"
Video = "src/ui/video.zi"
VideoLinux = "src/backend/video_linux.zi"
Clock = "src/ui/clock.zi"
ClockLinux = "src/backend/clock_linux.zi"
Service = "src/ui/service.zi"
ServiceLinux = "src/backend/service_linux.zi"
DPI = "src/ui/dpi.zi"
Zoom = "src/ui/zoom.zi"
SystemTheme = "src/ui/system_theme.zi"
SystemThemeLinux = "src/backend/system_theme_linux.zi"
SystemThemeHost = "src/ui/system_theme_host.zi"
SystemThemeHostLinux = "src/backend/system_theme_host_linux.zi"
SystemClipboardLinux = "src/backend/system_clipboard_linux.zi"
Dialog = "src/ui/dialog.zi"
FileDialogLinux = "src/backend/file_dialog_linux.zi"
Tray = "src/backend/Tray/module.zi"
PageRoute = "src/backend/page_route.zi"
# Building blocks for widget packages such as Plot and DataViews,
# which draw into the retained tree with Kryon's own primitives.
session = "src/ui/session.zi"
control_props = "src/ui/control_props.zi"
menu_props = "src/ui/menu_props.zi"
text_input_props = "src/ui/text_input_props.zi"
clipboard = "src/ui/clipboard.zi"
system_clipboard = "src/ui/system_clipboard.zi"
font_metrics = "src/ui/font_metrics.zi"
paint_queue = "src/ui/paint_queue.zi"
scroll = "src/ui/scroll.zi"
semantic = "src/ui/semantic.zi"
style = "src/ui/style.zi"
style_sheet = "src/ui/style_sheet.zi"
surface = "src/ui/surface.zi"
tree = "src/ui/tree.zi"
tree_input = "src/ui/tree_input.zi"
text_request = "src/ui/text_request.zi"
AccessibilityLinux = "src/backend/accessibility_linux.zi"
widget_kind = "src/ui/widget_kind.zi"
system_theme = "src/ui/system_theme.zi"
theme = "src/ui/theme.zi"

[tool]
project = "build/bin/kryon"

# Project templates: `kryon new hello` (or `ziran new hello --template
# kryonlabs/kryon`) starts from the first; `kryon new hello --template tui`
# from another.
[templates]
app = "templates/app"
tui = "templates/tui"
pages = "templates/pages"
web = "templates/web"

# Settings an application gives the kryon tool under [tool.kryon].
[options]
default_profile = "string"
entry = "string"

[options.profiles."*"]
backend = "string!"
codegen = "string=c99"
host = "string"
library = "string"
static_archive = "string"
assets = "string"

# Android profile settings: the application id of the generated droid
# project, the minimum system version, the built ABIs, and the activity
# class name inside the package.
[options.android]
package = "string"
min_sdk = "string=21"
abis = "string=arm64-v8a"
activity = "string=MainActivity"

# Used by `ziran install` to build one profile and add it to the desktop.
[options.install]
profile = "string"
name = "string"
comment = "string"
icon = "string"
categories = "string"
working_directory = "string"
autostart = "bool=false"
autostart_env = "string"
