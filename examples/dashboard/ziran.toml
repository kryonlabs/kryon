[package]
name = "dashboard"
entry = "src/app.tsx"
module_roots = ["src", "previews"]
links = ["X11", "cairo"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "fe57aa00fe91541afd347d3be0aad7fcf8d3044f"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "0724d828113af5fba018c66103e6566ed733750e"

[dependencies.css]
git = "https://git.waozi.xyz/kryonlabs/css.git"
ref = "f5ee1580d78fe4453d5b8202396a3e0132fcdda3"

[tool.kryon]
default_profile = "desktop"
entry = "src/app.tsx"

[tool.kryon.profiles.desktop]
backend = "desktop"
host = "src/desktop_host.zi"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.web]
backend = "canvas"
