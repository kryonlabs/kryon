[package]
name = "{{name}}"
entry = "src/app.zi"
module_roots = ["src"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "e225a4fe6acd41c40c78a46f6dab6ff779dd08ce"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "39f7540d193ccaa2096e1115df608da8116b32b7"

# `kryon build` writes build/{{name}}-web.html, a page drawn on a Canvas2D
# element, and `kryon run desktop` opens the same interface in a window.
[tool.kryon]
default_profile = "web"
entry = "src/app.zi"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.profiles.desktop]
backend = "desktop"

# Downloadable app, rendered by the shared Zx player.
[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

# `kryon run shot > screen.ppm` renders one frame without a display.
[tool.kryon.profiles.shot]
backend = "pixmap"
