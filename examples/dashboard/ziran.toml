[package]
name = "dashboard"
entry = "src/app.zi"
module_roots = ["src", "previews"]
links = ["X11", "cairo"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "8133bd41ef171e03ce4557b55122eb739548eb72"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "02cc10e682b83fe7ba9c2ed4638507818d3c9cc0"

[dependencies.css]
git = "https://git.waozi.xyz/kryonlabs/css.git"
ref = "b0e83ac2d2d8e3abc35ab015d447bef5c17517ca"

[tool.kryon]
default_profile = "desktop"
entry = "src/app.zi"

[tool.kryon.profiles.desktop]
backend = "desktop"
host = "src/desktop_host.zi"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.profiles.shot]
backend = "pixmap"
