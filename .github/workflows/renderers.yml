name: renderers

# Build downloadable KRB renderers for every platform: the headless
# renderer (krb-run) as native binaries, and the web player (krb-web)
# as static files any site can host.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cc: cc, suffix: linux-x86_64 }
          - { os: ubuntu-latest, cc: x86_64-w64-mingw32-gcc, suffix: windows-x86_64 }
          - { os: macos-latest, cc: cc, suffix: macos-universal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw (windows cross)
        if: matrix.suffix == 'windows-x86_64'
        run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: Build krb-run
        run: |
          make build/bin/krb-run CC=${{ matrix.cc }} \
            KRY_SW_SRCS="src/krb/krb.c src/backend/kry_backend.c src/backend/kry_sw.c src/backend/kry_backend_rec.c"
      - name: Rename
        run: cp build/bin/krb-run krb-run-${{ matrix.suffix }}${{ matrix.suffix == 'windows-x86_64' && '.exe' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: krb-run-${{ matrix.suffix }}
          path: krb-run-${{ matrix.suffix }}*

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
      - name: Build web player
        run: make krb-web
      - name: Package
        run: |
          mkdir -p krb-player-web && cp build/linux-x86_64/web/krb-web/* krb-player-web/
          cp examples/02_buttons.kry /tmp/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: krb-player-web
          path: krb-player-web/

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [native, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - run: |
          mkdir rel && cp -r krb-run-* krb-player-web rel/
      - uses: softprops/action-gh-release@v2
        with:
          files: rel/*
