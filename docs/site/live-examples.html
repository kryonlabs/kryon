<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kryon Live Examples</title>
  <meta name="description" content="Run Kryon examples and widget catalogs live in the browser, with .kry, KIR, C, Go, KRB, and canvas output side by side.">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/proj/kryon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="ide-page">
  <header class="site-header">
    <div class="site-header-inner">
      <a class="brand" href="index.html">
        <img src="icons/proj/kryon.png" alt="Kryon" width="22" height="22">
        <span>KRYON</span>
      </a>
      <button class="menu-toggle" type="button" aria-label="Open site menu" aria-expanded="false" aria-controls="header-nav">Menu</button>
      <nav class="header-nav" id="header-nav" aria-label="Primary">
        <a href="/">Home</a>
        <a href="showcase.html">Showcase</a>
        <a href="language.html">Language</a>
        <a href="matrices.html">Matrices</a>
        <a href="renderers.html">Renderers</a>
        <a href="/api">API</a>
        <a href="live-examples.html">Live Examples</a>
        <a href="ide.html">Web IDE</a>
        <a class="star-pill" href="https://github.com/kryonlabs/kryon" target="_blank" rel="noopener">* <span class="count">GitHub</span></a>
      </nav>
    </div>
  </header>

  <main class="web-ide live-examples" data-live-examples>
    <section class="ide-shell">
      <div class="ide-toolbar">
        <div>
          <p class="section-eyebrow">Live Examples</p>
          <h1>Source, generated code, and canvas output</h1>
        </div>
        <div class="ide-actions">
          <button class="btn" type="button" data-action="reload">Reload</button>
          <button class="btn btn-primary" type="button" data-action="compile">Run</button>
        </div>
      </div>

      <div class="live-grid">
        <aside class="ide-pane example-browser">
          <div class="pane-title">
            <span>Examples + widgets</span>
            <span data-count>loading</span>
          </div>
          <div class="example-list" data-example-list></div>
        </aside>

        <div class="ide-pane source-pane">
          <div class="pane-title">
            <span data-source-title>source</span>
            <span data-status>Loading compiler...</span>
          </div>
          <textarea spellcheck="false" data-source></textarea>
        </div>

        <div class="ide-pane preview-pane">
          <div class="pane-title">
            <span>Live canvas output</span>
            <span data-preview-status>waiting</span>
          </div>
          <canvas width="800" height="600" data-preview></canvas>
        </div>

        <div class="ide-pane artifact-pane">
          <div class="artifact-tabs" role="tablist" aria-label="Generated artifacts">
            <button type="button" class="is-active" data-tab="kry">.kry</button>
            <button type="button" data-tab="kir">KIR</button>
            <button type="button" data-tab="c">C</button>
            <button type="button" data-tab="go">Go</button>
            <button type="button" data-tab="krb">KRB</button>
          </div>
          <pre class="artifact-output"><code data-artifact></code></pre>
        </div>
      </div>
    </section>
  </main>

  <script src="ide-tools/k2ir.js"></script>
  <script src="ide-tools/k2b.js"></script>
  <script src="ide-tools/k2c.js"></script>
  <script src="ide-tools/k2g.js"></script>
  <script src="ide-tools/krb-web.js"></script>
  <script src="live-examples.js"></script>
</body>
</html>
