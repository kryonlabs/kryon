"4" = "A volume slider linked to a progress bar."
"5" = "Two independent labeled switches."
"6" = "Two checkboxes for related choices."
"7" = "A mutually exclusive two-option radio group."
"8" = "A labeled determinate progress bar."
"9" = "A bounded minutes spinner with a formatted value."
"10" = "Single-selection list of five rows."
"11" = "Multiple-selection list of five rows."
"12" = "Three adjacent exclusive segment choices."
"13" = "Three document tabs."
"14" = "Two independently selectable rows."
"15" = "A labeled separator and bullet marker."
"16" = "A titled fieldset grouping preferences."
"17" = "A collapsible section that reveals content."
"18" = "A start-time picker initialized to 9:30."
"19" = "A four-channel accent color picker."
"20" = "Three-item navigation bar with icons and active state."
"21" = "Toolbar with enabled and disabled actions."
"22" = "Library title bar with a leading back action."
"23" = "A timed saved-changes toast."
"24" = "An open context menu with a disabled remove action."
"25" = "A grouped file menu."
"26" = "A documentation link control."
"27" = "A display heading and wrapping Unicode body text."
"28" = "A smoothed image with alternative text."
"29" = "A rounded, bordered surface."
"30" = "Filled circle, partial ring, triangle, and line primitives."
"31" = "A ten-row scroll viewport."
"32" = "Modal frame with a title and done action."
"33" = "A save-or-cancel action dialog."
"34" = "A floating popup panel."
"35" = "An invisible press-and-hold interaction area."
"36" = "A vertical two-button column layout."
"37" = "A horizontal two-button row layout."
"38" = "An overlapping two-button stack layout."
"39" = "A sequential two-button group layout."
"40" = "A two-column grid layout."
"41" = "A page, section, heading, and paragraph composition."
"42" = "A navigation route configuration editor."
"43" = "A three-row drag-reorder list."
"44" = "Adjustable vertical split panes."
"45" = "A scrim-backed overlay dismissed by outside click."
"46" = "Five button emphasis levels in two tones."
"47" = "An open dropdown list."
"48" = "A screen content container with two buttons."
"49" = "A wrapping flow layout for two buttons."
"50" = "Selectable wrapped text."
"51" = "An out-transition color over labeled content."
