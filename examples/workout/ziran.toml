[package]
name = "workout"
entry = "src/workout.tsx"
module_roots = ["src"]
tool = "kryon"
links = ["GL", "EGL"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "4596187a757f0810c80e607d6c1c96f08ba8a934"

[tool.kryon]
default_profile = "desktop"
entry = "src/workout.tsx"

[tool.kryon.profiles.desktop]
backend = "desktop"
assets = "assets"

[tool.kryon.profiles.android]
backend = "android"
assets = "assets"

[tool.kryon.android]
package = "xyz.waozi.kryon.workout"
abis = "armeabi-v7a"
frame_mode = "events"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "master"
