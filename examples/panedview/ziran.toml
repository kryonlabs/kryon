[package]
name = "panedview"
entry = "panedview.tsx"
module_roots = ["."]
tool = "kryon"


[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "fe57aa00fe91541afd347d3be0aad7fcf8d3044f"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.portable_web]
backend = "canvas"
codegen = "zx"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "0724d828113af5fba018c66103e6566ed733750e"

[dependencies.plot]
git = "https://git.waozi.xyz/kryonlabs/plot.git"
ref = "f8dfe1ea005e55b9975d4c0fab885bee640c6d96"

[dependencies.data_views]
git = "https://git.waozi.xyz/kryonlabs/data-views.git"
ref = "0b0c051d922cb618880a054e2b92f2b96c1f2444"
