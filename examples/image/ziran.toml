[package]
name = "image"
entry = "image.zi"
module_roots = ["."]
tool = "kryon"


[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "e225a4fe6acd41c40c78a46f6dab6ff779dd08ce"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"
assets = "assets"

[tool.kryon.profiles.portable_web]
backend = "canvas"
codegen = "zx"
assets = "assets"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[dependencies.plot]
git = "https://github.com/kryonlabs/plot.git"
ref = "master"

[dependencies.data_views]
git = "https://github.com/kryonlabs/data-views.git"
ref = "master"
