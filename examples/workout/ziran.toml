[package]
name = "workout"
entry = "src/workout.tsx"
module_roots = ["src"]
tool = "kryon"
links = ["GL", "EGL"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "fe57aa00fe91541afd347d3be0aad7fcf8d3044f"

[tool.kryon]
default_profile = "desktop"
entry = "src/workout.tsx"

[tool.kryon.profiles.desktop]
backend = "desktop"
assets = "assets"

[tool.kryon.profiles.android]
backend = "android"
assets = "assets"

[tool.kryon.android]
package = "xyz.waozi.kryon.workout"
abis = "armeabi-v7a"
frame_mode = "events"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "0724d828113af5fba018c66103e6566ed733750e"
