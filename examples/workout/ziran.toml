[package]
name = "workout"
entry = "src/workout.tsx"
module_roots = ["src"]
tool = "kryon"
links = ["GL", "EGL"]

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "84c42c76a63b022fa9355148c4213d9032b7eeff"

[tool.kryon]
default_profile = "desktop"
entry = "src/workout.tsx"

[tool.kryon.profiles.desktop]
backend = "desktop"
assets = "assets"

[tool.kryon.profiles.android]
backend = "android"
assets = "assets"

[tool.kryon.android]
package = "xyz.waozi.kryon.workout"
abis = "armeabi-v7a"
frame_mode = "events"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "master"
