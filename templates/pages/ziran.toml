[package]
name = "{{name}}"
entry = "src/app.tsx"
module_roots = ["src"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "fe57aa00fe91541afd347d3be0aad7fcf8d3044f"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "0724d828113af5fba018c66103e6566ed733750e"

[install]
bin = "{{name}}"

# `kryon run` opens the default profile; `kryon run tui` picks another.
[tool.kryon]
default_profile = "desktop"
entry = "src/app.tsx"

[tool.kryon.profiles.desktop]
backend = "desktop"

# Downloadable app, rendered by the shared Zx player.
[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.tui]
backend = "terminal"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.install]
profile = "desktop"
name = "{{name}}"
comment = "A Kryon application"
categories = "Utility;"
