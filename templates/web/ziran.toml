[package]
name = "{{name}}"
entry = "src/app.zi"
module_roots = ["src"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

# `kryon build` writes build/{{name}}-web.html, a semantic HTML page;
# `kryon run canvas` draws the same page on a Canvas2D element and
# `kryon run desktop` in a window.
[tool.kryon]
default_profile = "web"
entry = "src/app.zi"

[tool.kryon.profiles.web]
backend = "dom"

[tool.kryon.profiles.canvas]
backend = "canvas"

[tool.kryon.profiles.desktop]
backend = "desktop"

# `kryon run shot > screen.ppm` renders one frame without a display.
[tool.kryon.profiles.shot]
backend = "pixmap"
