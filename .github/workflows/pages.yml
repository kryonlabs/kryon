name: Cloudflare Pages

on:
  push:
    branches: [master]
    paths:
      - docs/site/**
      - examples/gallery/**
      - src/**
      - mk/**
      - ziran.toml
      - scripts/gallery.py
      - scripts/build-gallery.py
      - scripts/build-site.py
      - ziran.lock
      - tests/portable_format_runtime.cjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-runtime:
    name: Build ZX website
    runs-on: ubuntu-latest
    env:
      MAKEFLAGS: -j2
    defaults:
      run:
        working-directory: kryonlabs/kryon
    steps:
      - uses: actions/checkout@v7
        with:
          path: kryonlabs/kryon
      # The locked compiler comes prebuilt.
      - name: Set up the locked Ziran
        uses: ziranlang/ziran/.github/actions/setup@79ca2f95c0e90e6c339e2921a198b4f946eb50bb
        with:
          project: kryonlabs/kryon
          path: ziranlang/ziran
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.6'
      - name: Select these source revisions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          root = Path(os.environ['GITHUB_WORKSPACE'])
          settings = '[overrides]\nkryon = "' + str(root / 'kryonlabs/kryon') + '"\nziran = "' + str(root / 'ziranlang/ziran') + '"\n'
          for project in ('.', 'docs/site/demo', 'examples/gallery'):
              (Path(project) / 'ziran.local.toml').write_text(settings)
          PY
      - name: Build and verify portable browser assets
        run: |
          export PATH="$GITHUB_WORKSPACE/ziranlang/ziran/build/bin:$PATH"
          export ZIRAN_ROOT="$GITHUB_WORKSPACE/ziranlang/ziran"
          python3 scripts/build-site.py
          node tests/portable_format_runtime.cjs
          ZIRAN_PLAYGROUND_RUNTIME="$PWD/docs/site/assets/playground-runtime.js" node "$GITHUB_WORKSPACE/ziranlang/ziran/tests/web_bundle_runtime.cjs"
      - name: Stage public website files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil, subprocess
          site = Path('docs/site')
          output = Path('build/scratch/website-deploy')
          paths = {Path(p) for p in subprocess.check_output(['git', 'ls-files', '-z', '--', str(site)]).decode().split('\0') if p}
          paths.add(site / 'gallery-data.js')
          paths.update((site / 'gallery-sources').rglob('*.zi'))
          for source in paths:
              destination = output / source.relative_to(site)
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: kryon-website
          path: kryonlabs/kryon/build/scratch/website-deploy/
          if-no-files-found: error

  verify:
    name: ${{ matrix.name }}
    needs: browser-runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gallery 1/3
            mode: gallery
            shard: 0
          - name: Gallery 2/3
            mode: gallery
            shard: 1
          - name: Gallery 3/3
            mode: gallery
            shard: 2
          - name: Live editor
            mode: editor
            shard: 0
    defaults:
      run:
        working-directory: kryonlabs/kryon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: kryonlabs/kryon

      - uses: actions/download-artifact@v6
        with:
          name: kryon-website
          path: kryonlabs/kryon/docs/site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install private display tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 xvfb

      # Test and deploy the same runtime built from the locked compiler.
      - name: Check static site assets
        run: |
          test -f docs/site/index.html
          test -f docs/site/demo.html
          test -f docs/site/assets/widgets.html
          test -f docs/site/assets/preview.html
          test -f docs/site/assets/playground-runtime.js
          test -f docs/site/assets/playground-runtime.wasm
          test -f docs/site/demo.js
          test -f docs/site/demo.css
          test -f docs/site/demo-worker.js
          test -f docs/site/demo-theme.js
          test -f docs/site/current.css
          test -f docs/site/favicon.svg
          test -f docs/site/favicon-32.png
          test -f docs/site/og.png
          test -f docs/site/assets/brand/mark.svg
          test -f docs/site/widgets.html
          test -f docs/site/assets/widget-gallery.html
          test -f docs/site/assets/catalog-image.png
          test -f docs/site/gallery-data.js
          test -f docs/site/live-editor.js
          test -f docs/site/gallery-sources/kryon/0.zi

      - name: Test the compiled widget gallery
        if: matrix.mode == 'gallery'
        env:
          CHROMIUM: google-chrome
          GALLERY_SHARDS: '3'
          GALLERY_SHARD: ${{ matrix.shard }}
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY -u DBUS_SESSION_BUS_ADDRESS YUE_DESKTOP_RECOVERY=0 node tests/gallery_browser.mjs

      - name: Test live preview and rendered themes
        if: matrix.mode == 'editor'
        env:
          CHROMIUM: google-chrome
        run: env -u DISPLAY -u WAYLAND_DISPLAY -u XAUTHORITY node tests/demo_browser.mjs

  deploy-production:
    name: Deploy Kryon Labs
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          path: kryonlabs/kryon

      - uses: actions/download-artifact@v6
        with:
          name: kryon-website
          path: kryonlabs/kryon/docs/site

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy kryonlabs/kryon/docs/site --project-name=kryon --branch=master
