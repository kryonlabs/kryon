name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    name: Ziran library and host tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kryon
    steps:
      - name: Checkout Kryon
        uses: actions/checkout@v7
        with:
          path: kryon

      - name: Checkout Ziran
        uses: actions/checkout@v7
        with:
          repository: kryonlabs/ziran
          path: ziran

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 ripgrep

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'

      - name: Check submodule URLs
        run: sh scripts/check-submodule-urls.sh

      - name: Build and test
        run: env -u DISPLAY -u WAYLAND_DISPLAY make test

      - name: Test SVG example
        run: env -u DISPLAY -u WAYLAND_DISPLAY make -C examples test
