[package]
name = "{{name}}"
entry = "src/app.tsx"
module_roots = ["src"]
bridge_modules = ["app"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "fac8a39688135feb38671553fb288887170575ab"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "39f7540d193ccaa2096e1115df608da8116b32b7"

[install]
bin = "{{name}}"

# `kryon run` opens the default profile; `kryon run tui` picks another.
[tool.kryon]
default_profile = "desktop"
entry = "src/app.tsx"

[tool.kryon.profiles.desktop]
backend = "desktop"

# Downloadable app, rendered by the shared Zx player.
[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.tui]
backend = "terminal"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.install]
profile = "desktop"
name = "{{name}}"
comment = "A Kryon application"
categories = "Utility;"
