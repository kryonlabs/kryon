dom_app_run = "src/backend/dom_app_run.zi"
# Building blocks for widget packages such as Plot and DataViews,
# which draw into the retained tree with Kryon's own primitives.
session = "src/ui/session.zi"
control_props = "src/ui/control_props.zi"
menu_props = "src/ui/menu_props.zi"
text_input_props = "src/ui/text_input_props.zi"
clipboard = "src/ui/clipboard.zi"
system_clipboard = "src/ui/system_clipboard.zi"
font_metrics = "src/ui/font_metrics.zi"
paint_queue = "src/ui/paint_queue.zi"
scroll = "src/ui/scroll.zi"
semantic = "src/ui/semantic.zi"
style = "src/ui/style.zi"
style_sheet = "src/ui/style_sheet.zi"
surface = "src/ui/surface.zi"
tree = "src/ui/tree.zi"
tree_input = "src/ui/tree_input.zi"
text_request = "src/ui/text_request.zi"
AccessibilityLinux = "src/backend/accessibility_linux.zi"
widget_kind = "src/ui/widget_kind.zi"
system_theme = "src/ui/system_theme.zi"
theme = "src/ui/theme.zi"

[tool]
project = "build/bin/kryon"

# Project templates: `kryon new hello` (or `ziran new hello --template
# kryonlabs/kryon`) starts from the first; `kryon new hello --template tui`
# from another.
[templates]
app = "templates/app"
tui = "templates/tui"
pages = "templates/pages"
web = "templates/web"

# Settings an application gives the kryon tool under [tool.kryon].
[options]
default_profile = "string"
entry = "string"

[options.profiles."*"]
backend = "string!"
codegen = "string=c99"
host = "string"
library = "string"
static_archive = "string"
assets = "string"

# Android profile settings: the application id of the generated droid
# project, the minimum system version, the built ABIs, and the activity
# class name inside the package.
[options.android]
package = "string"
min_sdk = "string=21"
abis = "string=arm64-v8a"
activity = "string=MainActivity"

# Used by `ziran install` to build one profile and add it to the desktop.
[options.install]
profile = "string"
name = "string"
comment = "string"
icon = "string"
categories = "string"
working_directory = "string"
autostart = "bool=false"
autostart_env = "string"
