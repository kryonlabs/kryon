[package]
name = "tilemap"
entry = "tilemap.tsx"
module_roots = ["."]
tool = "kryon"


[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "84c42c76a63b022fa9355148c4213d9032b7eeff"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"
assets = "assets"

[tool.kryon.profiles.web]
backend = "canvas"
assets = "assets"

[tool.kryon.profiles.portable]
backend = "desktop"
assets = "assets"
codegen = "zx"

[tool.kryon.profiles.portable_web]
backend = "canvas"
assets = "assets"
codegen = "zx"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "master"
