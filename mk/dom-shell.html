<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kryon Ziran</title>
  <style>
    html { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, sans-serif; }
    #kryon-dom-root { min-height: 100vh; }
    :where([data-kryon-widget="Row"]) { display: flex; }
    :where([data-kryon-widget="Column"]) { display: flex; flex-direction: column; }
    :where([data-kryon-widget="Grid"], [data-kryon-widget="Stack"]) { display: grid; }
    :where([data-kryon-widget="Stack"] > *) { grid-area: 1 / 1; }
    :where([data-kryon-widget="Scroll"]) { overflow: auto; }
    :where(button) { font: inherit; }
  </style>
  <style id="kryon-dom-author"></style>
</head>
<body>
  <div id="kryon-dom-root" data-kryon-widget="Screen"></div>
  {{{ SCRIPT }}}
</body>
</html>
