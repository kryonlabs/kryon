[package]
name = "gallery"
entry = "src/app.zi"
module_roots = ["src", "build/catalog"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
# Ziran v0.5.0
ref = "f9f92b46db88b48cede41a6feb560915972b2ce6"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"
host = "src/desktop.zi"
assets = "assets"

[tool.kryon.profiles.web]
backend = "canvas"
host = "src/web.zi"
assets = "assets"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"
assets = "assets"

[tool.kryon.profiles.portable_web]
backend = "canvas"
codegen = "zx"
assets = "assets"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[dependencies.plot]
git = "https://github.com/kryonlabs/plot.git"
ref = "master"

[dependencies.data_views]
git = "https://github.com/kryonlabs/data-views.git"
ref = "master"
