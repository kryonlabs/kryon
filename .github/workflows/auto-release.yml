name: Automatic Release Version

on:
  schedule:
    # Batched patch release: at most one per day, and only when maintainers
    # have written user-facing notes under "## Unreleased".
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kryon-auto-release
  cancel-in-progress: false

jobs:
  bump-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Skip an already released commit
        id: guard
        run: |
          if git tag --points-at HEAD --list 'v*' | grep -q .; then
            echo 'release=false' >> "$GITHUB_OUTPUT"
          else
            echo 'release=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Require curated release notes
        if: steps.guard.outputs.release == 'true'
        id: notes
        run: |
          if scripts/release-notes.sh --check CHANGELOG.md; then
            echo 'release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'release=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping: no curated notes under "## Unreleased".' \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Resolve next version
        if: steps.guard.outputs.release == 'true' && steps.notes.outputs.release == 'true'
        id: version
        run: |
          current=$(make -s version)
          if git rev-parse -q --verify "refs/tags/$current" >/dev/null; then
            version=$(scripts/bump-version.sh patch)
          else
            version=$current
          fi
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      - name: Commit version
        if: steps.guard.outputs.release == 'true' && steps.notes.outputs.release == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add include/kryon_version.h
          if ! git diff --cached --quiet; then
            git commit -m "release: bump version to ${{ steps.version.outputs.tag }}"
            git push origin HEAD:master
          fi

      - name: Start release workflow
        if: steps.guard.outputs.release == 'true' && steps.notes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run release.yml --ref master
          -f version=${{ steps.version.outputs.tag }}
          -f prerelease=false
