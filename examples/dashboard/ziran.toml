[package]
name = "dashboard"
entry = "src/app.zi"
module_roots = ["src", "previews"]
links = ["X11", "cairo"]
tool = "kryon"

[toolchain]
git = "https://git.waozi.xyz/ziranlang/ziran.git"
ref = "9432a110709c4a4f72c4f732fcfc368e15213a54"

[dependencies.kryon]
git = "https://git.waozi.xyz/kryonlabs/kryon.git"
ref = "b107847a7893d3af1c891ef61eb43f3011658621"

[dependencies.css]
git = "https://git.waozi.xyz/kryonlabs/css.git"
ref = "eba580e376695d352eb91e8008295bca3bf58d33"

[tool.kryon]
default_profile = "desktop"
entry = "src/app.zi"

[tool.kryon.profiles.desktop]
backend = "desktop"
host = "src/desktop_host.zi"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.profiles.shot]
backend = "pixmap"
