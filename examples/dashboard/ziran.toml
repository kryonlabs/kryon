[package]
name = "dashboard"
entry = "src/app.zi"
module_roots = ["src", "previews"]
links = ["X11", "cairo"]
tool = "kryon"

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "d60a9c91fa78c875a25a77ddf284d2482760e443"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "35fc05cbb776ed17fecf760fe8ae85127e01f5a3"

[dependencies.css]
git = "https://github.com/kryonlabs/css.git"
ref = "ad4ec746bba579ec2450791f99ce1ea9ce21f3a7"

[tool.kryon]
default_profile = "desktop"
entry = "src/app.zi"

[tool.kryon.profiles.desktop]
backend = "desktop"
host = "src/desktop_host.zi"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.profiles.shot]
backend = "pixmap"
