[package]
name = "alert"
entry = "alert.zi"
module_roots = ["."]
tool = "kryon"


[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "7fbc8152b0ab18b641a73d16d93ccda1e1c7f863"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"

[tool.kryon.profiles.web]
backend = "canvas"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.portable_web]
backend = "canvas"
codegen = "zx"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"
