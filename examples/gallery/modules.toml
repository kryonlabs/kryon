"54" = "Filled, elevated, and outlined card variants."

[[modules]]
id = "plot"
label = "Plot"
dependency = "plot"
source = "src/plot_examples.zi"
module = "plot_examples"
styles = "InstallStyles"
category = "Charts"
[modules.summaries]
"0" = "An eight-value line plot with a fixed scale."
"1" = "An eight-value bar plot with a fixed scale."
"2" = "A single-series line chart with a grid."
"3" = "A current and previous series comparison."
"4" = "Candles with highs, lows, and volume."
"5" = "Point values inside and outside a target band."

[[modules]]
id = "data_views"
label = "DataViews"
dependency = "data_views"
source = "src/data_views_examples.zi"
module = "data_views_examples"
styles = "InstallStyles"
category = "UI"
[modules.summaries]
"0" = "An expandable project tree with selection and scrolling."
"1" = "A three-lane kanban board with draggable cards."
"2" = "A sortable, resizable six-row table."
[modules.notes]
"1" = "Drag a card to another column. The board keeps the new position."
"2" = "Select a cell, sort by a header, drag a column divider, or scroll the rows. Arrow keys move the selected cell."

[[modules]]
id = "inputs"
label = "Inputs"
dependency = "kryon"
source = "src/input_components_examples.zi"
module = "input_components_examples"
category = "Inputs"
[modules.summaries]
"0" = "Editable tags with duplicate and maximum handling."
"1" = "Six alphanumeric one-time code slots with paste filtering."
"2" = "In-place text editing with commit and cancel states."
"3" = "Drag, arrows, and typed input for a clamped numeric value."
"4" = "Currency formatting, editing, parsing, and validation."
"5" = "Focused shortcut capture without a global accelerator."
[modules.keyboard]
"0" = "Enter or a comma commits a tag; Backspace on an empty field removes the final tag."
"1" = "Characters type at the cursor; Left and Right move, Backspace deletes, Escape cancels, and paste filters invalid bytes."
"2" = "Activation selects the value; Enter or blur commits, while Escape restores the saved value."
"3" = "Left/Right and Up/Down step the value; Shift changes fine or coarse behavior; Enter edits text and Escape cancels."
"4" = "Focus switches to editable text; Enter or blur commits a parsed clamped value and Escape restores it."
"5" = "Enter activates recording; supported key chords are accepted, bare Escape cancels, and Backspace or Delete clears."

[[modules]]
id = "overlays"
label = "Overlays"
dependency = "kryon"
source = "src/overlay_components_examples.zi"
module = "overlay_components_examples"
category = "Overlays"
[modules.summaries]
"0" = "Hover and focus tooltip with placement fitting."
"1" = "Bottom sheet with scrim, drag close, and focus return."
"2" = "Fuzzy command search with keyboard selection."
"3" = "Delayed hover card with an explicit action."
"4" = "Danger confirmation popover with focused actions."
"5" = "Targeted guided tour with scrim and focus wrap."
[modules.keyboard]
"0" = "Hover or focus opens after the delay; touch press suppresses replay and Escape closes when supported by the caller."
"1" = "Escape or the scrim closes; the handle supports drag close, and focus wraps across title, close, and content."
"2" = "Type filters commands; Up and Down move, Enter chooses, and Escape closes."
"3" = "Hover or keyboard focus opens after the delay; Tab reaches the action and activation reports its caller-owned ID."
"4" = "Confirm starts focused; Enter or Space confirms, Escape cancels, outside press closes, and focus returns to the trigger."
"5" = "Left and Right move focus; Enter activates the focused control, and Back, Next, Done, and Skip report explicit actions."
